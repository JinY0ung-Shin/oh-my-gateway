services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.codex
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
        - http_proxy
        - https_proxy
        - no_proxy
        - APT_MIRROR_URL
        - APT_SECURITY_MIRROR_URL
        - NPM_CONFIG_REGISTRY
        - CODEX_VERSION
        - PIP_INDEX_URL
        - PIP_EXTRA_INDEX_URL
        - PIP_TRUSTED_HOST
        - GATEWAY_BUILD_INSTALL_CACHE_BUST
      secrets:
        - gateway_build_install_script
    depends_on:
      gateway-log:
        condition: service_healthy
        required: false
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      # Persist Codex CLI/app-server auth, config, and session state.
      - codex_home:/home/app/.codex
      # Share the host CA bundle with the container for corporate roots.
      - ${HOST_CA_CERTIFICATES_PATH:-/etc/ssl/certs/ca-certificates.crt}:/etc/ssl/certs/ca-certificates.crt:ro
      # Persist admin overrides across restarts.
      - ./data:/app/data
      # Per-user workspaces ({USER_WORKSPACES_DIR}/{user}/{backend}). Persisted
      # to the host so individual users' state survives container recreates.
      # Override the host path with USER_WORKSPACES_HOST_DIR.
      - ${USER_WORKSPACES_HOST_DIR:-./workspaces}:/data/workspaces
      # Optional host system-prompt file. Set SYSTEM_PROMPT_HOST_FILE in .env to
      # a host path; it is mounted read-only here and SYSTEM_PROMPT_FILE below
      # auto-points at it. Unset maps /dev/null (preset mode).
      - ${SYSTEM_PROMPT_HOST_FILE:-/dev/null}:/app/system_prompt.md:ro
    env_file:
      - .env
    environment:
      - ADMIN_API_KEY=${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      - BACKENDS=codex
      - DEFAULT_MODEL=${CODEX_DEFAULT_GATEWAY_MODEL:-codex/gpt-5.5}
      - CODEX_BIN=codex
      - CODEX_HOME=/home/app/.codex
      - CODEX_MODELS=${CODEX_MODELS:-gpt-5.5}
      - CODEX_APPROVAL_POLICY=${CODEX_APPROVAL_POLICY:-never}
      - CODEX_SANDBOX=${CODEX_SANDBOX:-danger-full-access}
      - CODEX_CONFIG_OVERRIDES=${CODEX_CONFIG_OVERRIDES:-}
      - USER_WORKSPACES_DIR=${USER_WORKSPACES_DIR:-/data/workspaces}
      # Admin-managed plugin manifest persisted to the ./data bind mount so it
      # survives image redeploy and `docker compose down -v`.
      - CLAUDE_PLUGIN_MANIFEST=${CLAUDE_PLUGIN_MANIFEST:-/app/data/gateway-plugins.json}
      # Auto-wire the custom system prompt to the host file mounted above; empty
      # (preset mode) when SYSTEM_PROMPT_HOST_FILE is unset. Overrides .env.
      - SYSTEM_PROMPT_FILE=${SYSTEM_PROMPT_HOST_FILE:+/app/system_prompt.md}

  gateway-log:
    profiles: ["logging"]
    image: mysql:8.0
    container_name: gateway-log
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${GATEWAY_LOG_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${GATEWAY_LOG_MYSQL_ROOT_PASSWORD:-gateway_root}
      MYSQL_DATABASE: ${GATEWAY_LOG_MYSQL_DATABASE:-gateway_log}
      MYSQL_USER: ${GATEWAY_LOG_MYSQL_USER:-gateway}
      MYSQL_PASSWORD: ${GATEWAY_LOG_MYSQL_PASSWORD:-gateway}
    volumes:
      - ./data/mysql_data:/var/lib/mysql
      - ./docker/mysql_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${GATEWAY_LOG_MYSQL_ROOT_PASSWORD:-gateway_root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  codex_home:

secrets:
  gateway_build_install_script:
    file: ${GATEWAY_BUILD_INSTALL_SCRIPT:-./docker/noop_build_install.sh}
