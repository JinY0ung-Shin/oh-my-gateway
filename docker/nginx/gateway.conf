# oh-my-gateway front door — takes the host port and hands every request to the active color
# (gateway-blue | gateway-green). docs/zero-downtime-deploy.md §3.
#
# This file is an nginx-image TEMPLATE (mounted as /etc/nginx/templates/default.conf.template):
# at container start the image's envsubst step renders ${GATEWAY_*} names only
# (NGINX_ENVSUBST_FILTER=^GATEWAY_ in docker-compose.yml), so nginx's own $variables stay as they
# are. GATEWAY_PORT is the compose PORT: the proxy listens on it and the colors serve on it, the
# same port the gateway used when it published the host port itself. A PORT change needs the proxy
# recreated (`docker compose up -d gateway-proxy`), not just reloaded.
#
# The active color is one line in state/active.conf (`set $gateway_upstream gateway-<color>;`),
# written by scripts/deploy.sh, which then runs `nginx -s reload`. Reload is graceful: new requests
# go to the new color, open ones (SSE turn streams, uploads) stay on the old worker and the old
# color until they finish. Routing goes to that ONE color only — which color owns a session is the
# gateway's to know (handoff/forwarding, §5.2), not nginx's.
#
# The gateway must see the request as if nginx were not there: Host as sent, no body limit, no
# buffering. X-Forwarded-For is OVERWRITTEN with the real peer (never appended): the colors trust it
# from this container's fixed address only (FORWARDED_ALLOW_IPS), so the client address the gateway
# sees is exactly the TCP peer it saw before the proxy — a client cannot pick it, a loopback one
# included.

# WebSocket upgrades pass through (none today, but nothing here should silently break one);
# plain requests send no client Connection header upstream.
map $http_upgrade $gateway_connection {
    default upgrade;
    ""      "";
}

map $http_x_forwarded_proto $gateway_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen ${GATEWAY_PORT};

    # Resolve the color name per request through compose's embedded DNS: a color recreated with a
    # new address, or absent at reload time, never stops nginx (requests in that gap get a 502).
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    # Fallback before the first deploy writes the state file (a fresh install starts blue).
    set $gateway_upstream gateway-blue;
    include /etc/nginx/gateway-state/*.conf;

    # Upload limits are the gateway's (MAX_REQUEST_SIZE and friends) — an nginx 413 page would
    # replace the gateway's own JSON error.
    client_max_body_size 0;

    # Instance-to-instance routes (drain control, ping, session release, dispatch settle) — the
    # colors call each other on the compose network, never through here. HMAC/admin-key checks in
    # the app are the second lock; this keeps them unreachable from outside in the first place.
    # nginx matches the decoded, dot-segment- and slash-normalized path, so `/./internal/`,
    # `//internal/` and `/%69nternal/` land here too.
    location ^~ /internal/ {
        return 404;
    }
    location = /internal {
        return 404;
    }

    # Deploy-script probe (answers loopback callers inside the color only) — not a public path.
    location = /health/drain {
        return 404;
    }
    location ^~ /health/drain/ {
        return 404;
    }

    location / {
        proxy_pass http://$gateway_upstream:${GATEWAY_PORT};
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gateway_connection;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $gateway_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;

        # SSE (turn streams) must flow byte by byte, and uploads stream into the app.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        # Turns with long tool calls stay open for tens of minutes (the gateway sends SSE keepalives
        # and tool-progress frames) — nginx must not be the one that gives up first.
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
