services:
  gateway:
    restart: unless-stopped
    build:
      context: .
      # Inherit proxy settings from the host shell at build time.
      # Listed without values so Compose reads them from the host environment;
      # unset ones are simply not forwarded. HTTP_PROXY / HTTPS_PROXY / NO_PROXY
      # (and lowercase) are predefined build ARGs in Docker — no Dockerfile ARG
      # declaration needed, and they are not persisted in image history.
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
        - http_proxy
        - https_proxy
        - no_proxy
        # Optional apt/npm/pip overrides for private/corporate mirrors.
        # Export these in the shell before 'docker compose build' on corp networks.
        - APT_MIRROR_URL
        - APT_SECURITY_MIRROR_URL
        - NPM_CONFIG_REGISTRY
        - PIP_INDEX_URL
        - PIP_EXTRA_INDEX_URL
        - PIP_TRUSTED_HOST
        - GATEWAY_BUILD_INSTALL_CACHE_BUST
      secrets:
        - gateway_build_install_script
    # Wait for the optional gateway-log MySQL sidecar to pass its healthcheck
    # before starting the gateway, so the usage-log engine can connect on first
    # try.  ``required: false`` (Compose v2.20+) keeps the gateway runnable
    # when the ``logging`` profile is off and gateway-log isn't created.
    depends_on:
      gateway-log:
        condition: service_healthy
        required: false
    # Let the container reach the host's published ports (e.g. UniBridge edge
    # on host :3000) via host.docker.internal, used by ANTHROPIC_BASE_URL.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # ${PORT} is interpolated by Compose at parse-time from the shell env and
    # the ./.env file next to this compose file. It is NOT read from the service's
    # env_file. If you move PORT into a non-default env file, pin the host side
    # explicitly (e.g. "8000:${PORT}") instead of relying on auto-interpolation.
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      # Container's claude CLI state lives in a named docker volume rather than
      # a host bind mount: host customizations (skills, CLAUDE.md, conversation
      # history) do not leak in, but per-container state — conversation logs,
      # caches, settings written by the SDK — survives container recreates.
      # Auth comes from ANTHROPIC_AUTH_TOKEN in .env, not from a credentials
      # file. To opt back into host assets, add a separate read-only mount,
      # e.g. ~/.claude/skills:/home/app/.claude/skills:ro
      - claude_home:/home/app/.claude
      # Share the host CA bundle with the container so git/curl/Python trust the
      # same corporate roots. Override HOST_CA_CERTIFICATES_PATH in .env when
      # the host bundle lives outside the Debian/Ubuntu default path.
      - ${HOST_CA_CERTIFICATES_PATH:-/etc/ssl/certs/ca-certificates.crt}:/etc/ssl/certs/ca-certificates.crt:ro
      # Persist admin overrides (system prompt, runtime config) across restarts
      - ./data:/app/data
      # Per-user workspaces ({USER_WORKSPACES_DIR}/{user}/{backend}). Persisted
      # to the host so individual users' state survives container recreates.
      # The container defaults USER_WORKSPACES_DIR to /data/workspaces (see the
      # environment block below). Override the host path with
      # USER_WORKSPACES_HOST_DIR if you want it somewhere other than ./workspaces.
      - ${USER_WORKSPACES_HOST_DIR:-./workspaces}:/data/workspaces
      # Optional: bind a host system-prompt file into the container. Set
      # SYSTEM_PROMPT_HOST_FILE in .env to a host path (e.g. /home/me/prompt.md)
      # and it is mounted read-only here; the SYSTEM_PROMPT_FILE env below then
      # auto-points at it. When unset, /dev/null is mapped harmlessly and
      # SYSTEM_PROMPT_FILE stays empty (claude_code preset mode).
      - ${SYSTEM_PROMPT_HOST_FILE:-/dev/null}:/app/system_prompt.md:ro
    # All runtime configuration comes from .env (see .env.example for the full list).
    env_file:
      - .env
    environment:
      # Fail fast if ADMIN_API_KEY is missing — the server refuses to start without it.
      - ADMIN_API_KEY=${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      # Persist per-user workspaces to the host bind mount by default.
      - USER_WORKSPACES_DIR=${USER_WORKSPACES_DIR:-/data/workspaces}
      # Docker installs optional plugins into the container user's ~/.claude,
      # so include user-scope config when the Claude SDK starts.
      - CLAUDE_SETTING_SOURCES=${CLAUDE_SETTING_SOURCES:-user,project,local}
      # Admin-managed plugin manifest layered on top of the CLAUDE_PLUGIN_* env
      # bootstrap. Persisted to the ./data bind mount so it survives image
      # redeploy AND `docker compose down -v` (which wipes claude_home's plugin
      # cache); install_plugins.py reinstalls manifest.added and reapplies
      # manifest.removed on next boot (self-healing).
      - CLAUDE_PLUGIN_MANIFEST=${CLAUDE_PLUGIN_MANIFEST:-/app/data/gateway-plugins.json}
      # Auto-wire the custom system prompt to the host file mounted above.
      # Resolves to /app/system_prompt.md only when SYSTEM_PROMPT_HOST_FILE is
      # set; otherwise empty so the claude_code preset is used. This overrides
      # any SYSTEM_PROMPT_FILE in .env — under Docker, set SYSTEM_PROMPT_HOST_FILE.
      - SYSTEM_PROMPT_FILE=${SYSTEM_PROMPT_HOST_FILE:+/app/system_prompt.md}

  # Optional MySQL sidecar that persists per-turn usage logs (token counts,
  # tool-call stats).  Activated only when the `logging` compose profile is
  # enabled (e.g. `docker compose --profile logging up`).  When the profile
  # is off the gateway runs standalone and no MySQL image is pulled.
  gateway-log:
    profiles: ["logging"]
    image: mysql:8.0
    container_name: gateway-log
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${GATEWAY_LOG_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${GATEWAY_LOG_MYSQL_ROOT_PASSWORD:-gateway_root}
      MYSQL_DATABASE: ${GATEWAY_LOG_MYSQL_DATABASE:-gateway_log}
      MYSQL_USER: ${GATEWAY_LOG_MYSQL_USER:-gateway}
      MYSQL_PASSWORD: ${GATEWAY_LOG_MYSQL_PASSWORD:-gateway}
    volumes:
      - ./data/mysql_data:/var/lib/mysql
      - ./docker/mysql_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${GATEWAY_LOG_MYSQL_ROOT_PASSWORD:-gateway_root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  # Claude CLI per-container state (conversation history, caches, settings).
  # Inspect with: docker volume inspect claude-code-openai-wrapper_claude_home
  # Wipe with:    docker compose down -v   (or: docker volume rm <name>)
  claude_home:

secrets:
  gateway_build_install_script:
    file: ${GATEWAY_BUILD_INSTALL_SCRIPT:-./docker/noop_build_install.sh}
